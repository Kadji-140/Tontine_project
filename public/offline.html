<!doctype html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="title" content="Tontine Pro - Hors Ligne">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            height: 100vh;
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .offline-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            padding: 2rem;
            text-align: center;
        }

        .offline-icon {
            font-size: 120px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 2rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        .offline-title {
            color: white;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .offline-message {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem;
            margin-bottom: 2rem;
            max-width: 500px;
        }

        .offline-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .offline-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            color: #764ba2;
        }

        .offline-tips {
            margin-top: 3rem;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
        }

        .offline-tips ul {
            list-style: none;
            padding: 0;
            margin-top: 1rem;
        }

        .offline-tips li {
            margin: 0.5rem 0;
        }

        .offline-tips i {
            margin-right: 0.5rem;
        }

        @media (max-width: 768px) {
            .offline-icon {
                font-size: 80px;
            }

            .offline-title {
                font-size: 1.8rem;
            }

            .offline-message {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <i class="fas fa-wifi-slash offline-icon"></i>
        
        <h1 class="offline-title">Connexion Interrompue</h1>
        
        <p class="offline-message">
            Impossible de se connecter au serveur. Veuillez vérifier votre connexion internet et réessayer.
        </p>
        
        <a href="/" class="offline-btn">
            <i class="fas fa-redo me-2"></i> Réessayer
        </a>

        <div class="offline-tips">
            <p><strong>Suggestions :</strong></p>
            <ul>
                <li><i class="fas fa-check-circle"></i> Vérifiez votre connexion Wi-Fi ou données mobiles</li>
                <li><i class="fas fa-check-circle"></i> Assurez-vous que le mode avion est désactivé</li>
                <li><i class="fas fa-check-circle"></i> Redémarrez votre routeur si nécessaire</li>
            </ul>
        </div>
    </div>
</body>
</html>
