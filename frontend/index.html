<!doctype html>
<html lang="fr" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tontine Pro - Plateforme moderne de gestion collaborative de tontines" />
    <title>Tontine Pro - Gestion Moderne de Tontines</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Prévention du flash de thème blanc au chargement -->
    <script>
      (function() {
        const themeStocke = localStorage.getItem('theme_tontine');
        const prefereSombre = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (themeStocke === 'sombre' || (!themeStocke && prefereSombre)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="h-full bg-slate-50 dark:bg-sombre-fond text-slate-800 dark:text-sombre-texte font-sans antialiased transition-colors duration-200">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
